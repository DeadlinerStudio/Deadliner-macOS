name: Build macOS app

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: client
          persist-credentials: false
      - name: Prepare build tools
        run: |
          xcodebuild -version
          brew list --versions xcodegen || brew install xcodegen
      - name: Install the pinned Core framework
        working-directory: client
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USERNAME: ${{ github.actor }}
        run: scripts/build-core.sh release
      - name: Build and verify Release packages
        working-directory: client
        run: scripts/package.sh "$RUNNER_TEMP/package"
      - uses: actions/upload-artifact@v4
        with:
          name: Deadliner-macOS-arm64
          path: ${{ runner.temp }}/package/
          if-no-files-found: error
      - name: Test task status and date parsing
        working-directory: client
        run: |
          xcodebuild test -project DeadlinerMac.xcodeproj -scheme DeadlinerMac \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/test-derived" \
            -testLanguage zh-Hans -testRegion CN \
            -only-testing:DeadlinerMacTests/TaskStatusTests
