name: Build macOS app

on:
  workflow_dispatch:
    inputs:
      cli_run_id:
        description: Optional DeadlinerCli Actions run for native task round-trip testing
        required: false
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEADLINER_LIFI_MODE: stub
      DEADLINER_CORE_DIR: ${{ github.workspace }}/core
    steps:
      - uses: actions/checkout@v4
        with:
          path: client
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: DeadlinerStudio/DeadlinerCore
          ref: e5e6ea5d89df156b6cbeaba896c702477e124643
          path: core
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare build tools
        run: |
          xcodebuild -version
          brew list --versions xcodegen || brew install xcodegen
      - name: Install Kotlin/Native distribution
        working-directory: core
        run: ./gradlew -PlifiMode=stub :shared:downloadKotlinNativeDistribution --console=plain
      - name: Build and verify Release packages
        working-directory: client
        run: scripts/package.sh "$RUNNER_TEMP/package"
      - uses: actions/upload-artifact@v4
        with:
          name: Deadliner-macOS-arm64
          path: ${{ runner.temp }}/package/
          if-no-files-found: error
      - name: Test task status and date parsing
        working-directory: client
        run: |
          xcodebuild test -project DeadlinerMac.xcodeproj -scheme DeadlinerMac \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/test-derived" \
            -only-testing:DeadlinerMacTests/TaskStatusTests

      - name: Verify Swift and native CLI round trip
        if: inputs.cli_run_id != ''
        working-directory: client
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_RUN_ID: ${{ inputs.cli_run_id }}
        run: |
          gh run download "$CLI_RUN_ID" -R DeadlinerStudio/DeadlinerCli -n deadliner-cli-arm64 -D "$RUNNER_TEMP/cli-package"
          tar -xzf "$RUNNER_TEMP"/cli-package/*.tgz -C "$RUNNER_TEMP/cli-package"
          swiftc -swift-version 6 -F Frameworks -framework Shared -Xlinker -rpath -Xlinker "$PWD/Frameworks" \
            Sources/Features/CLI/*.swift Sources/Core/{LocalTaskPeer,CoreClock,CoreDates}.swift \
            Sources/Models/TaskItem.swift Sources/Stores/TaskCommands.swift Sources/Features/Tasks/TaskShareLink.swift \
            scripts/tests/CLITaskRoundTrip.swift -o "$RUNNER_TEMP/probe"
          python3 scripts/tests/cli-round-trip.py "$RUNNER_TEMP/cli-package/package/bin/deadliner" "$RUNNER_TEMP/probe"
