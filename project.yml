name: DeadlinerMac
options:
  bundleIdPrefix: com.deadliner
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    FRAMEWORK_SEARCH_PATHS: $(PROJECT_DIR)/Frameworks

targets:
  DeadlinerMac:
    type: application
    platform: macOS
    sources:
      - Sources
      - Resources
    settings:
      base:
        PRODUCT_NAME: Deadliner for macOS
        PRODUCT_BUNDLE_IDENTIFIER: com.deadliner.macos
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/DeadlinerMac.entitlements
        OTHER_LDFLAGS: -lsqlite3
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME: NO
    dependencies:
      - framework: Frameworks/Shared.framework
        embed: true
        codeSign: true
    preBuildScripts:
      - name: Build DeadlinerCore
        script: '"${PROJECT_DIR}/scripts/build-core.sh"'
        basedOnDependencyAnalysis: false

  DeadlinerMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deadliner.macos.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Deadliner for macOS.app/Contents/MacOS/Deadliner for macOS
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: DeadlinerMac
      - framework: Frameworks/Shared.framework
        embed: false

schemes:
  DeadlinerMac:
    build:
      targets:
        DeadlinerMac: all
        DeadlinerMacTests: [test]
    test:
      targets:
        - DeadlinerMacTests
