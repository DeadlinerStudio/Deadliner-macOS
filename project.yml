name: DeadlinerMac
options:
  bundleIdPrefix: com.deadliner
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    FRAMEWORK_SEARCH_PATHS: $(PROJECT_DIR)/Frameworks

targetTemplates:
  # 正式应用与测试宿主共用同一份代码与配置，只有身份（Bundle ID / 名称）不同。
  DeadlinerApp:
    type: application
    platform: macOS
    sources:
      - Sources
      - Resources
    settings:
      base:
        PRODUCT_MODULE_NAME: Deadliner_for_macOS
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/DeadlinerMac.entitlements
        OTHER_LDFLAGS: -lsqlite3
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - framework: Frameworks/Shared.framework
        embed: true
        codeSign: true

targets:
  DeadlinerMac:
    templates: [DeadlinerApp]
    settings:
      base:
        PRODUCT_NAME: Deadliner for macOS
        PRODUCT_BUNDLE_IDENTIFIER: com.deadliner.macos
    preBuildScripts:
      - name: Build DeadlinerCore
        script: '"${PROJECT_DIR}/scripts/build-core.sh"'
        basedOnDependencyAnalysis: false

  # 单元测试的宿主：独立的 Bundle ID，因此拥有独立的 UserDefaults、钥匙串访问组与沙盒数据目录，
  # 测试永远读不到正式应用的同步设置、密码与数据库。
  DeadlinerTestHost:
    templates: [DeadlinerApp]
    settings:
      base:
        PRODUCT_NAME: Deadliner Test Host
        PRODUCT_MODULE_NAME: DeadlinerTestHost
        PRODUCT_BUNDLE_IDENTIFIER: com.deadliner.macos.testhost
    dependencies:
      - target: DeadlinerMac

  DeadlinerMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deadliner.macos.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Deadliner Test Host.app/Contents/MacOS/Deadliner Test Host
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: DeadlinerTestHost
      - framework: Frameworks/Shared.framework
        embed: false

schemes:
  DeadlinerMac:
    build:
      targets:
        DeadlinerMac: all
        DeadlinerTestHost: [test]
        DeadlinerMacTests: [test]
    test:
      targets:
        - DeadlinerMacTests
